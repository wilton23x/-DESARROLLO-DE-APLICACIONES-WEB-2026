{% extends "base.html" %}

{% block title %}Contacto{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="card shadow-lg p-4">

<h2 class="mb-4 text-center">📞 Contáctanos</h2>

<p class="text-center text-muted">
Si tienes alguna duda sobre el sistema Biblioteca Virtual Express,
puedes enviarnos un mensaje mediante el siguiente formulario.
</p>

<form method="POST">

<div class="mb-3">

<label class="form-label">👤 Nombre</label>

<input type="text"
name="nombre"
class="form-control"
placeholder="Ingresa tu nombre completo"
required>

</div>

<div class="mb-3">

<label class="form-label">📧 Correo electrónico</label>

<input type="email"
name="correo"
class="form-control"
placeholder="tucorreo@email.com"
required>

</div>

<div class="mb-3">

<label class="form-label">💬 Mensaje</label>

<textarea name="mensaje"
class="form-control"
rows="4"
placeholder="Escribe aquí tu mensaje"
required></textarea>

</div>

<div class="text-center">

<button type="submit" class="btn btn-primary">
📨 Enviar mensaje
</button>

<a href="{{ url_for('inicio') }}" class="btn btn-secondary">
⬅ Volver
</a>

</div>

</form>

</div>

</div>

{% endblock %}
