{% extends "base.html" %}
{% block content %}

<div class="container mt-5">

    <!-- TITULO -->
    <div class="text-center mb-4">
        <h2>
            {% if producto %}
                ✏️ Editar Producto
            {% else %}
                ➕ Agregar Producto
            {% endif %}
        </h2>
        <p class="text-muted">Complete la información del producto</p>
    </div>

    <!-- FORMULARIO -->
    <div class="card shadow-lg p-4">

        <form method="post">

            <!-- NOMBRE -->
            <div class="mb-3">
                <label class="form-label fw-bold">Nombre</label>
                <div class="input-group">
                    <span class="input-group-text">📦</span>
                    <input type="text"
                           name="nombre"
                           class="form-control"
                           placeholder="Ingrese el nombre del producto"
                           value="{{ producto.nombre if producto else '' }}"
                           required>
                </div>
            </div>

            <!-- AUTOR -->
            <div class="mb-3">
                <label class="form-label fw-bold">Autor</label>
                <div class="input-group">
                    <span class="input-group-text">👤</span>
                    <input type="text"
                           name="autor"
                           class="form-control"
                           placeholder="Ingrese el autor"
                           value="{{ producto.autor if producto else '' }}">
                </div>
            </div>

            <!-- CANTIDAD -->
            <div class="mb-3">
                <label class="form-label fw-bold">Cantidad</label>
                <div class="input-group">
                    <span class="input-group-text">🔢</span>
                    <input type="number"
                           name="cantidad"
                           class="form-control"
                           placeholder="Ingrese la cantidad"
                           value="{{ producto.cantidad if producto else '' }}"
                           required>
                </div>
            </div>

            <!-- PRECIO -->
            <div class="mb-3">
                <label class="form-label fw-bold">Precio</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number"
                           step="0.01"
                           name="precio"
                           class="form-control"
                           placeholder="Ingrese el precio"
                           value="{{ producto.precio if producto else '' }}"
                           required>
                </div>
            </div>

            <!-- BOTONES -->
            <div class="text-center mt-4">

                <button type="submit" class="btn btn-success px-4">
                    💾 Guardar
                </button>

                <a href="/productos" class="btn btn-outline-secondary px-4">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
