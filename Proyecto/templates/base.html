<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Biblioteca Virtual Express{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">
                📚 Biblioteca Virtual
            </a>

            <button class="navbar-toggler" 
                    type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">

                    <a class="nav-link mx-2" href="{{ url_for('inicio') }}">
                        Inicio
                    </a>

                    <a class="nav-link mx-2" href="{{ url_for('lista_productos') }}">
                        Inventario
                    </a>

                    <a class="nav-link mx-2" href="{{ url_for('contactos') }}">
                        Contactos
                    </a>

                    <a class="nav-link mx-2" href="{{ url_for('about') }}">
                        Acerca de
                    </a>

                </div>
            </div>

        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mt-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-light text-center py-3 mt-auto border-top">
        <div class="container">
            <small>
                © 2026 - Sistema Avanzado de Gestión de Inventario |
                Universidad Estatal Amazónica |
                Desarrollo de Aplicaciones Web
            </small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
