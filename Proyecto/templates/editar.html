{% extends "base.html" %}

{% block title %}
{% if producto %}
Editar Libro
{% else %}
Nuevo Libro
{% endif %}
{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="card shadow p-4">

<h2 class="mb-4 text-center">

{% if producto %}
✏ Editar Libro
{% else %}
➕ Registrar Nuevo Libro
{% endif %}

</h2>

<form method="POST">

<div class="mb-3">

<label for="nombre" class="form-label">📚 Título del libro</label>

<input type="text"
id="nombre"
name="nombre"
class="form-control"
value="{{ producto.nombre if producto else '' }}"
required>

</div>

<div class="mb-3">

<label for="autor" class="form-label">👤 Autor</label>

<input type="text"
id="autor"
name="autor"
class="form-control"
value="{{ producto.autor if producto else '' }}">

</div>

<div class="mb-3">

<label for="cantidad" class="form-label">📦 Cantidad</label>

<input type="number"
id="cantidad"
name="cantidad"
class="form-control"
min="0"
value="{{ producto.cantidad if producto else '' }}"
required>

</div>

<div class="mb-3">

<label for="precio" class="form-label">💰 Precio</label>

<input type="number"
id="precio"
name="precio"
class="form-control"
step="0.01"
min="0"
value="{{ producto.precio if producto else '' }}"
required>

</div>

<div class="text-center">

<button type="submit" class="btn btn-success">
💾 Guardar
</button>

<a href="/productos" class="btn btn-secondary">
⬅ Cancelar
</a>

</div>

</form>

</div>

</div>

{% endblock %}
