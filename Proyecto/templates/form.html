{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    {% if producto %}
        <h2 class="mb-4">✏ Editar Libro</h2>
    {% else %}
        <h2 class="mb-4">➕ Agregar Nuevo Libro</h2>
    {% endif %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Nombre del Libro</label>
            <input type="text" 
                   name="nombre" 
                   class="form-control"
                   value="{{ producto.nombre if producto else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Autor</label>
            <input type="text" 
                   name="autor" 
                   class="form-control"
                   value="{{ producto.autor if producto else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" 
                   name="cantidad" 
                   class="form-control"
                   value="{{ producto.cantidad if producto else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" 
                   step="0.01"
                   name="precio" 
                   class="form-control"
                   value="{{ producto.precio if producto else '' }}"
                   required>
        </div>

        <button type="submit" class="btn btn-success">
            💾 Guardar
        </button>

        <a href="/productos" class="btn btn-secondary">
            🔙 Volver
        </a>

    </form>

</div>

{% endblock %}
