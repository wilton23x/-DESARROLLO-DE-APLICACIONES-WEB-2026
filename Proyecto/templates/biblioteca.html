{% extends "base.html" %}

{% block title %}Biblioteca{% endblock %}

{% block content %}

<h2 class="mb-4">📚 Biblioteca Virtual</h2>

<a href="/" class="btn btn-secondary mb-3">Volver al inicio</a>

<form action="/agregar" method="POST" class="row g-2 mb-4">
    <div class="col">
        <input type="text" name="titulo" class="form-control" placeholder="Título" required>
    </div>
    <div class="col">
        <input type="text" name="autor" class="form-control" placeholder="Autor" required>
    </div>
    <div class="col-auto">
        <button class="btn btn-primary">Agregar</button>
    </div>
</form>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        {% for libro in libros %}
        <tr>
            <td>{{ libro.titulo }}</td>
            <td>{{ libro.autor }}</td>
            <td>
                <a href="/editar/{{ libro.id }}" class="btn btn-warning btn-sm">Editar</a>
                <a href="/eliminar/{{ libro.id }}" 
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Seguro que deseas eliminar este libro?')">
                    Eliminar
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
