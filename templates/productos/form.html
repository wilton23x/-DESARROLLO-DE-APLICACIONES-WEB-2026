{% extends "base.html" %}

{% block title %}Producto{% endblock %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow-lg p-4 border-0">

<h3 class="text-center mb-4">
📚 {{ 'Editar Producto' if producto else 'Agregar Producto' }}
</h3>

<!-- MENSAJES -->
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-warning text-center">
      {{ messages[0] }}
    </div>
  {% endif %}
{% endwith %}

<form method="POST">

<div class="mb-3">
<label class="form-label">Nombre</label>
<input type="text" name="nombre" class="form-control"
value="{{ producto.nombre if producto else '' }}" required>
</div>

<div class="mb-3">
<label class="form-label">Autor</label>
<input type="text" name="autor" class="form-control"
value="{{ producto.autor if producto else '' }}" required>
</div>

<div class="mb-3">
<label class="form-label">Cantidad</label>
<input type="number" name="cantidad" class="form-control"
value="{{ producto.cantidad if producto else '' }}" required>
</div>

<div class="mb-3">
<label class="form-label">Precio</label>
<input type="number" step="0.01" name="precio" class="form-control"
value="{{ producto.precio if producto else '' }}" required>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-success">
Guardar
</button>
</div>

</form>

</div>
</div>
</div>

{% endblock %}
